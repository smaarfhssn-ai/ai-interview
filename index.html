<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Interview</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    video {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      background: #111;
      border-radius: 18px;
      display: block;
    }

    .status-container {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .status {
      flex: 1;
      padding: 18px;
      background: #f4f7fb;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
    }

    .ready {
      color: #16803c;
    }

    .failed {
      color: #d93025;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #1261c9;
      color: white;
    }

    #stopBtn {
      background: #e9eef5;
      color: #222;
    }

    #continueBtn {
      background: #16803c;
      color: white;
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    /* =========================
       INTERVIEW PAGE
    ========================= */

    #interviewPage {
      display: none;
    }

    .question-box {
      background: #f4f7fb;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
    }

    .question-label {
      font-size: 14px;
      color: #1261c9;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.4;
    }

    #startAnswer {
      background: #1261c9;
      color: white;
    }

    #stopAnswer {
      background: #d93025;
      color: white;
      display: none;
    }

    .recording {
      color: #d93025;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .transcript-box {
      margin-top: 25px;
    }

    .transcript-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #transcript {
      width: 100%;
      min-height: 180px;
      padding: 18px;
      border: 2px solid #e1e6ee;
      border-radius: 16px;
      font-size: 17px;
      line-height: 1.5;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px;
        padding: 20px;
      }

      .status-container {
        flex-direction: column;
      }

      .question {
        font-size: 20px;
      }

    }

  </style>

</head>

<body>


<!-- =========================
     CAMERA & MICROPHONE
========================= -->

<div class="container" id="devicePage">

  <h1>🎥 Camera & Microphone</h1>

  <p class="subtitle">
    Pastikan camera dan microphone anda berfungsi sebelum memulakan interview.
  </p>

  <video id="video" autoplay playsinline muted></video>

  <div class="status-container">

    <div class="status">

      📷 Camera:

      <span id="cameraStatus" class="failed">
        Not Ready
      </span>

    </div>

    <div class="status">

      🎙️ Microphone:

      <span id="micStatus" class="failed">
        Not Ready
      </span>

    </div>

  </div>

  <button id="startBtn" onclick="startDevices()">

    🎬 Test Camera & Microphone

  </button>

  <button id="stopBtn" onclick="stopDevices()">

    ⏹️ Stop

  </button>

  <button id="continueBtn" onclick="continueInterview()">

    Continue →

  </button>

  <p id="message" class="message"></p>

</div>


<!-- =========================
     INTERVIEW PAGE
========================= -->

<div class="container" id="interviewPage">

  <h1>🎤 AI Interview</h1>

  <p class="subtitle">

    Jawab soalan berikut menggunakan suara anda.

  </p>


  <div class="question-box">

    <div class="question-label">

      QUESTION 1

    </div>

    <div class="question">

      Tell me about yourself.

    </div>

  </div>


  <div class="timer">

    ⏱️ <span id="timer">00:00</span>

  </div>


  <div id="recordingStatus" class="recording">

    🔴 Listening...

  </div>


  <button id="startAnswer" onclick="startAnswer()">

    🎙️ Start Answer

  </button>


  <button id="stopAnswer" onclick="stopAnswer()">

    ⏹️ Stop Answer

  </button>


  <div class="transcript-box">

    <div class="transcript-title">

      📝 Your Answer

    </div>

    <textarea
      id="transcript"
      placeholder="Transcript jawapan anda akan muncul di sini..."
      readonly>
    </textarea>

  </div>


  <button
    id="nextQuestion"
    onclick="nextQuestion()"
    style="display:none; background:#16803c; color:white;">

    Next Question →

  </button>

</div>


<script>


/* =========================
   CAMERA & MICROPHONE
========================= */

let stream = null;


async function startDevices() {

  const cameraStatus =
    document.getElementById("cameraStatus");

  const micStatus =
    document.getElementById("micStatus");

  const message =
    document.getElementById("message");

  const video =
    document.getElementById("video");

  const continueBtn =
    document.getElementById("continueBtn");


  cameraStatus.textContent = "Checking...";
  micStatus.textContent = "Checking...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: true,
        audio: true

      });


    video.srcObject = stream;

    video.muted = true;
    video.volume = 0;


    cameraStatus.textContent =
      "✓ Ready";

    cameraStatus.className =
      "ready";


    micStatus.textContent =
      "✓ Ready";

    micStatus.className =
      "ready";


    message.textContent =
      "Camera dan microphone berjaya diaktifkan.";


    continueBtn.style.display =
      "block";

  }


  catch (error) {

    console.error(error);


    cameraStatus.textContent =
      "✗ Failed";

    cameraStatus.className =
      "failed";


    micStatus.textContent =
      "✗ Failed";

    micStatus.className =
      "failed";


    message.textContent =
      "Sila benarkan akses camera dan microphone pada browser.";

  }

}


/* =========================
   STOP DEVICES
========================= */

function stopDevices() {

  if (stream) {

    stream.getTracks().forEach(track => {

      track.stop();

    });

    stream = null;

  }


  document.getElementById("video").srcObject =
    null;


  document.getElementById("cameraStatus").textContent =
    "Not Ready";

  document.getElementById("micStatus").textContent =
    "Not Ready";


  document.getElementById("cameraStatus").className =
    "failed";

  document.getElementById("micStatus").className =
    "failed";


  document.getElementById("continueBtn").style.display =
    "none";


  document.getElementById("message").textContent =
    "Camera dan microphone dihentikan.";

}


/* =========================
   GO TO INTERVIEW
========================= */

function continueInterview() {

  if (!stream) {

    alert(
      "Sila aktifkan camera dan microphone dahulu."
    );

    return;

  }


  document.getElementById("devicePage").style.display =
    "none";


  document.getElementById("interviewPage").style.display =
    "block";

}


/* =========================
   SPEECH RECOGNITION
========================= */

let recognition = null;

let isListening = false;

let finalTranscript = "";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.lang = "en-US";


  recognition.onresult =
    function(event) {

      let interimTranscript = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;


        if (event.results[i].isFinal) {

          finalTranscript +=
            transcript + " ";

        }

        else {

          interimTranscript +=
            transcript;

        }

      }


      document.getElementById("transcript").value =
        finalTranscript + interimTranscript;

    };


  recognition.onerror =
    function(event) {

      console.error(
        "Speech recognition error:",
        event.error
      );

    };


  recognition.onend =
    function() {

      if (isListening) {

        try {

          recognition.start();

        }

        catch (error) {

          console.log(error);

        }

      }

    };

}


/* =========================
   START ANSWER
========================= */

let startTime = null;

let timerInterval = null;


function startAnswer() {

  if (!recognition) {

    alert(
      "Speech-to-Text tidak disokong oleh browser ini. Cuba Google Chrome."
    );

    return;

  }


  finalTranscript = "";

  document.getElementById("transcript").value =
    "";


  startTime =
    Date.now();


  timerInterval =
    setInterval(updateTimer, 1000);


  isListening = true;


  try {

    recognition.start();

  }

  catch (error) {

    console.log(error);

  }


  document.getElementById("startAnswer").style.display =
    "none";


  document.getElementById("stopAnswer").style.display =
    "block";


  document.getElementById("recordingStatus").style.display =
    "block";

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  if (!startTime) return;


  const elapsed =
    Math.floor(
      (Date.now() - startTime) / 1000
    );


  const minutes =
    Math.floor(elapsed / 60);


  const seconds =
    elapsed % 60;


  document.getElementById("timer").textContent =

    String(minutes).padStart(2, "0")
    + ":" +
    String(seconds).padStart(2, "0");

}


/* =========================
   STOP ANSWER
========================= */

function stopAnswer() {

  isListening = false;


  if (recognition) {

    try {

      recognition.stop();

    }

    catch (error) {

      console.log(error);

    }

  }


  clearInterval(timerInterval);


  document.getElementById("startAnswer").style.display =
    "block";


  document.getElementById("stopAnswer").style.display =
    "none";


  document.getElementById("recordingStatus").style.display =
    "none";


  document.getElementById("nextQuestion").style.display =
    "block";

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

  alert(
    "Transcript berjaya direkodkan! 🎉"
  );

}

</script>

</body>
</html>
